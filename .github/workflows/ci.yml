name: ci

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  bash-check:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install test dependencies
        run: sudo apt-get update && sudo apt-get install -y nginx shellcheck

      - name: Bash syntax check
        run: |
          bash -n nx.sh
          bash -n install.sh
          bash -n tests/*.sh

      - name: ShellCheck
        run: |
          shellcheck -x -S style nx.sh install.sh tests/*.sh

      - name: Run regression tests
        run: |
          for test_file in tests/*.sh; do
            bash "$test_file"
          done
