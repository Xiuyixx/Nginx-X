name: ci

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  bash-check:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-22.04, ubuntu-24.04]
    runs-on: ${{ matrix.os }}
    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Install test dependencies
        run: sudo apt-get update && sudo apt-get install -y nginx shellcheck python3 openssl curl

      - name: Bash syntax check
        run: |
          bash -n nx.sh
          bash -n install.sh
          for f in lib/*.sh tools/*.sh tests/*.sh; do bash -n "$f"; done
          bash tools/build-bundle.sh /tmp/nx-bundle
          bash -n /tmp/nx-bundle

      - name: ShellCheck source and installed bundle
        run: |
          shellcheck -x -S style nx.sh install.sh lib/*.sh tools/*.sh tests/*.sh
          shellcheck -S style /tmp/nx-bundle

      - name: Run regression tests
        run: |
          for test_file in tests/*.sh; do
            echo "Running ${test_file}"
            bash "$test_file"
          done

  alpine:
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Test Alpine with its packaged Nginx
        run: |
          docker run --rm -v "$PWD:/project" -w /project alpine:3.22 sh -ec '
            apk add --no-cache bash nginx python3 openssl curl git sudo coreutils findutils procps util-linux
            bash -ec '\''
              for test_file in tests/*.sh; do
                echo "Running ${test_file}"
                bash "$test_file"
              done
            '\''
          '

  acme-isolated:
    runs-on: ubuntu-24.04
    strategy:
      fail-fast: false
      matrix:
        proof: [identity, lifecycle]
    steps:
      - name: Checkout
        uses: actions/checkout@v5
      - name: Verify ACME identities and routing in disposable container
        env:
          ACME_PROOF: ${{ matrix.proof }}
        run: |
          docker run --rm -v "$PWD:/project:ro" -w /project \
            -e ACME_PROOF="$ACME_PROOF" alpine:3.22 sh -ec '
              apk add --no-cache bash nginx python3 openssl curl sudo shadow coreutils findutils procps util-linux
              NX_ACME_ISOLATED=1 bash "tests/acme_${ACME_PROOF}_isolated.sh"
            '
